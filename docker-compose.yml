# DocGraph 本地服务版（v0.6）——PostgreSQL / Neo4j / Weaviate
# 用法：docker compose up -d    （scripts/start_service.ps1 会自动执行并启动后端）
# 数据持久化在具名卷：pgdata / neo4jdata / weaviatedata
services:
  postgres:
    image: postgres:16-alpine
    container_name: docgraph-pg
    environment:
      POSTGRES_USER: docgraph
      POSTGRES_PASSWORD: docgraph
      POSTGRES_DB: docgraph_meta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docgraph -d docgraph_meta"]
      interval: 5s
      timeout: 3s
      retries: 12

  neo4j:
    image: neo4j:5-community
    container_name: docgraph-neo4j
    environment:
      NEO4J_AUTH: neo4j/docgraph123
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "7474:7474"   # HTTP 控制台
      - "7687:7687"   # Bolt 驱动端口
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  weaviate:
    image: semitechnologies/weaviate:1.26.1
    container_name: docgraph-weaviate
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      CLUSTER_HOSTNAME: "docgraph-weaviate"
    ports:
      - "8080:8080"
    volumes:
      - weaviatedata:/var/lib/weaviate
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  neo4jdata:
  weaviatedata:
