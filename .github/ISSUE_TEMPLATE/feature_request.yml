name: 功能建议
description: 提出新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你在什么场景下遇到了什么问题？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
    validations:
      required: true
  - type: input
    id: prd
    attributes:
      label: 关联 PRD 章节（可选）
      description: 例如 FR-310 文件分组
