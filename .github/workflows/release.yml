name: Release

# 打 tag（如 v0.1.0）时自动构建 Windows 单文件 exe 并发布到 GitHub Releases
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install uv
        run: pip install uv

      - name: Create venv and install dependencies
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"

      - name: Build frontend
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build exe (PyInstaller onefile)
        shell: powershell
        run: |
          ./.venv/Scripts/python.exe -m PyInstaller `
            --name DocGraph `
            --onefile `
            --windowed `
            --noconfirm `
            --paths src `
            --add-data "web/dist;web/dist" `
            --collect-all webview `
            --collect-all keyring `
            --hidden-import "webview.platforms.edgechromium" `
            --hidden-import "keyring.backends.Windows" `
            app/main.py

      - name: Compute SHA256
        shell: powershell
        run: Get-FileHash dist\DocGraph.exe -Algorithm SHA256 | Select-Object Hash | Out-File -FilePath dist\SHA256.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DocGraph.exe
            dist/SHA256.txt
          generate_release_notes: true
