[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docgraph"
version = "0.4.0"
description = "本地文档知识图谱工具：拖入 PDF/Word，LLM 抽取实体与关系，一键生成可交互知识图谱（单文件 exe）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DocGraph Contributors" }]
keywords = ["knowledge-graph", "llm", "document", "visualization", "desktop"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openai>=1.30",
    "networkx>=3.2",
    "pywebview>=5.0",
    "keyring>=25.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",  # 文档上传 Form 数据
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "reportlab>=4.0",  # 测试用：生成样例 PDF
    "pyinstaller>=6.0",  # 打包单文件 exe
]

[project.scripts]
docgraph = "app.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["docgraph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
